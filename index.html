<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Language Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 { text-align: center; color: #333; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            resize: vertical;
        }
        .box-title {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 5px;
            color: #555;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        select {
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        #output {
            background-color: #fff;
            border: 2px solid #ddd;
            min-height: 120px;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h1>Language Translator</h1>

    <div class="controls">
        <label for="mode">Translation Mode:</label>
        <select id="mode">
            <option value="encode">English ➔ My Language</option>
            <option value="decode">My Language ➔ English</option>
        </select>
    </div>

    <div class="box-title">Enter Text:</div>
    <textarea id="input" placeholder="Type here to translate..."></textarea>

    <div class="box-title">Translated Output:</div>
    <div id="output"></div>

    <script>
        // ==========================================
        // 1. YOUR DICTIONARY (Add your words here!)
        // ==========================================
        const wordReplacements = {
            "hello": "hl",
            "world": "wd",
            "please": "plz"
            // Keep adding your pairs like "english": "custom"
        };

        // ==========================================
        // 2. AUTOMATIC REVERSE DICTIONARY
        // ==========================================
        // This does exactly what {v: k for k, v in word_replacements.items()} did in Python
        const reverseReplacements = {};
        for (const [key, value] of Object.entries(wordReplacements)) {
            reverseReplacements[value.toLowerCase()] = key;
        }

        // ==========================================
        // 3. TRANSLATION LOGIC (Using Regex)
        // ==========================================
        function performTranslation(userInput, mode) {
            if (!userInput.trim()) return "";

            // Choose the correct dictionary based on the dropdown menu
            const activeDictionary = (mode === "encode") ? wordReplacements : reverseReplacements;

            // This matches words just like \b[a-zA-Z]+\b in Python
            // 'g' means global (replace all matches)
            const wordRegex = /\b[a-zA-Z]+\b/g;

            // This handles the replacement function, mimicking replace_match / reverse_match
            const result = userInput.replace(wordRegex, (match) => {
                const lowerMatch = match.toLowerCase();
                
                // If the word exists in our dictionary, return it. Otherwise, return the original word.
                return activeDictionary[lowerMatch] || match;
            });

            return result;
        }

        // ==========================================
        // 4. INTERFACE EVENT LISTENERS
        // ==========================================
        const inputArea = document.getElementById('input');
        const outputDiv = document.getElementById('output');
        const modeSelect = document.getElementById('mode');

        function updateTranslation() {
            const currentMode = modeSelect.value;
            const textToTranslate = inputArea.value;
            outputDiv.textContent = performTranslation(textToTranslate, currentMode);
        }

        // Run the translation when user types OR changes the dropdown mode
        inputArea.addEventListener('input', updateTranslation);
        modeSelect.addEventListener('change', updateTranslation);
    </script>
</body>
</html>
