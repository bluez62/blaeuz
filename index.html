<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaeuz Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background-color: #eef2f7;
            color: #2c3e50;
            position: relative;
            min-height: 90vh;
            box-sizing: border-box;
        }
        h1 { 
            text-align: center; 
            color: #1e3d59;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #b4c5e4;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #1e3d59;
        }
        .box-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #1e3d59;
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        select {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid #b4c5e4;
            background-color: white;
            color: #1e3d59;
            font-weight: bold;
            cursor: pointer;
        }
        .clear-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-left: auto;
            transition: background-color 0.2s;
        }
        .clear-btn:hover {
            background-color: #cc0000;
        }
        .output-container {
            position: relative;
            background-color: #fff;
            border: 2px solid #b4c5e4;
            min-height: 120px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #output {
            padding: 15px;
            padding-top: 45px;
            font-size: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #1e3d59;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .copy-btn:hover {
            background-color: #17b978;
        }
        .version-tag {
            text-align: right;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 40px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>Blaeuz Translator</h1>

    <div class="controls">
        <label for="mode" style="font-weight: 600;">Translation Mode:</label>
        <select id="mode">
            <option value="encode">English ➔ Blaeuz</option>
            <option value="decode">Blaeuz ➔ English</option>
        </select>
        
        <button id="clearBtn" class="clear-btn">Clear All</button>
    </div>

    <div class="box-title">Enter Text:</div>
    <textarea id="input" placeholder="Type here to translate..."></textarea>

    <div class="box-title">Translated Output:</div>
    <div class="output-container">
        <button id="copyBtn" class="copy-btn">Copy</button>
        <div id="output"></div>
    </div>

    <div class="version-tag">Version 1.0.0</div>

        const reverseReplacements = {};
        for (const [key, value] of Object.entries(wordReplacements)) {
            reverseReplacements[value.toLowerCase()] = key;
        }

        function performTranslation(userInput, mode) {
            if (!userInput.trim()) return "";

            const activeDictionary = (mode === "encode") ? wordReplacements : reverseReplacements;
            const wordRegex = /\b[a-zA-Z]+\b/g;

            return userInput.replace(wordRegex, (match) => {
                const lowerMatch = match.toLowerCase();
                return activeDictionary[lowerMatch] || match;
            });
        }

        const inputArea = document.getElementById('input');
        const outputDiv = document.getElementById('output');
        const modeSelect = document.getElementById('mode');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        function updateTranslation() {
            const currentMode = modeSelect.value;
            const textToTranslate = inputArea.value;
            outputDiv.textContent = performTranslation(textToTranslate, currentMode);
        }

        inputArea.addEventListener('input', updateTranslation);
        modeSelect.addEventListener('change', updateTranslation);

        copyBtn.addEventListener('click', () => {
            const textToCopy = outputDiv.textContent;
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.textContent = "Copied!";
                copyBtn.style.backgroundColor = "#17b978";
                
                setTimeout(() => {
                    copyBtn.textContent = "Copy";
                    copyBtn.style.backgroundColor = "#1e3d59";
                }, 1500);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        });

        clearBtn.addEventListener('click', () => {
            inputArea.value = "";
            outputDiv.textContent = "";
            inputArea.focus();
        });
